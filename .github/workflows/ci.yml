name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck (TypeScript noEmit)
        run: npx tsc --noEmit

      # NOTE: `npm test` (node --test) is intentionally skipped — it relies on
      # ESM-without-extension imports which don't resolve in Node's native
      # ESM loader (ERR_MODULE_NOT_FOUND). The same tests run under Vitest
      # via `test:smoke` and `test:store` below, which uses Vite's resolver
      # and works correctly. Re-enable `npm test` once `tsconfig` is migrated
      # to `moduleResolution: "node16"` or `"nodenext"`.

      - name: Smoke tests (Vitest + RTL)
        run: npm run test:smoke

      - name: Store tests (Zustand + wsQueue)
        run: npx vitest run --config vitest.store.config.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Workers dry-run
        run: npm run workers:check

  # Supabase contract tests are intentionally disabled — they require a
  # local Supabase instance (`supabase start`) and a live DB. Run them
  # manually via `npm run test:supabase` when needed.

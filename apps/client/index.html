<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Card Wars</title>
    <meta name="description" content="Карточная игра Карточные Войны онлайн" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#243326" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Card Wars" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <script>
      // Self-heal from stale Service Worker caches on script load error
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('cw_cache_bust')) {
          sessionStorage.setItem('cw_cache_bust', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var r of regs) r.unregister();
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var k of keys) caches.delete(k);
                  var u = new URL(location.href);
                  u.searchParams.set('_cw_bust', Date.now().toString());
                  location.replace(u.toString());
                });
              } else {
                location.reload();
              }
            });
          } else {
            location.reload();
          }
        }
      }, true);

      // Auto-heal empty screen if bundle fails to mount into #root
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('cw_root_bust')) {
          sessionStorage.setItem('cw_root_bust', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var r of regs) r.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var k of keys) caches.delete(k);
              var u = new URL(location.href);
              u.searchParams.set('_cw_bust', Date.now().toString());
              location.replace(u.toString());
            });
          } else {
            var u = new URL(location.href);
            u.searchParams.set('_cw_bust', Date.now().toString());
            location.replace(u.toString());
          }
        }
      }, 3000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

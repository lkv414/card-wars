<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Cards — разметка карт</title>
  <style>
    :root { --bg:#0f1117; --panel:#1a1d27; --panel2:#232735; --acc:#ff9800; --ok:#36d399; --txt:#e6e6e6; --mut:#9aa0b0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui, sans-serif; }
    header { position:sticky; top:0; z-index:10; background:#12141c; border-bottom:1px solid #2a2e3c; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    .pill { background:var(--panel2); border:1px solid #2a2e3c; border-radius:999px; padding:4px 10px; color:var(--mut); font-size:12px; }
    .pill b { color:var(--txt); }
    button { cursor:pointer; border:none; border-radius:8px; padding:8px 12px; font-weight:600; background:var(--panel2); color:var(--txt); }
    button:hover { filter:brightness(1.15); }
    button.primary { background:var(--acc); color:#1a1a2e; }
    button.ghost { background:transparent; border:1px solid #2a2e3c; }
    .spacer { flex:1; }
    .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; padding:16px; }
    .card { background:var(--panel); border:1px solid #2a2e3c; border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .card.reviewed { border-color:var(--ok); }
    .card img { width:100%; height:360px; object-fit:contain; background:#0b0d13; border-radius:10px; }
    .card .fname { font-size:12px; color:var(--mut); display:flex; justify-content:space-between; align-items:center; }
    .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#243; color:var(--ok); }
    .status { font-size:12px; font-weight:700; }
    .status[data-state="ok"] { color: var(--ok); }
    /* мини-полоса с эмодзи-статами (cost/attack/health) */
    .stats { display:flex; gap:6px; }
    .stat { flex:1; display:flex; align-items:center; gap:6px;
            background:var(--panel2); border:1px solid #2a2e3c;
            border-radius:8px; padding:4px 8px; font-size:13px;
            cursor:text; min-width:0; }
    .stat:focus-within { border-color:var(--acc); }
    .stat-icon { font-size:14px; line-height:1; flex-shrink:0; }
    .stat input { background:transparent; border:none; outline:none;
                  color:var(--txt); font:inherit; font-weight:600;
                  width:100%; min-width:0; padding:0; }
    .row { display:grid; grid-template-columns:120px 1fr; gap:8px; align-items:center; }
    .row label { color:var(--mut); font-size:12px; }
    .row input, .row select, .row textarea { background:var(--panel2); border:1px solid #2a2e3c; color:var(--txt); border-radius:6px; padding:6px 8px; font:inherit; width:100%; }
    .row textarea { resize:vertical; min-height:48px; }
    .ocr { background:#0b0d13; border:1px dashed #2a2e3c; border-radius:8px; padding:8px; font-size:12px; white-space:pre-wrap; color:#cdd3e0; max-height:140px; overflow:auto; }
    .actions { display:flex; gap:8px; }
    .hint { color:var(--mut); font-size:12px; }
    .err { color:#ff6b6b; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>OCR Cards</h1>
    <span class="pill">Всего: <b id="total">—</b></span>
    <span class="pill">Показано: <b id="range">—</b></span>
    <span class="pill">Размечено: <b id="reviewed">0</b></span>
    <span class="pill">Ключей OCR: <b id="keys">?</b></span>
    <div class="spacer"></div>
    <button class="ghost" id="prev">← Предыдущие 8</button>
    <button class="ghost" id="next">Следующие 8 →</button>
    <button class="primary" id="analyzeAll" style="background:#7c5cff;color:#fff;">⚡ Анализировать все 8</button>
    <button class="primary" id="saveAll">Сохранить все показанные</button>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    const LAND = ["corn","ice","good","swamp","sand","blue","any","rainbow","plains","forest","sky","undead","donut","cosmic","slime","princess","candy"];
    // card_type: сервер возвращает русское (заклинание/существо/...), но UI показывает английское
    // Совместим обе нотации через маппинг
    const TYPE_EN = ["creature","building","spell","special"];
    const TYPE_RU = ["существо","здание","заклинание","особая"];
    const TYPE = TYPE_EN.concat(TYPE_RU); // выпадающий список покажет и так и так
    // Стат-поля вынесены из общего списка — рендерим их отдельной мини-полосой
    const STAT_FIELDS = new Set(["cost", "attack", "health"]);
    const FIELDS = [
      ["name","Название"],
      ["card_type","Тип","select",TYPE],
      ["cost","Цена"],["attack","Атака"],["health","Здоровье"],
      ["land_type","Земля","select",LAND],
      ["description","Описание","textarea"],
      ["is_rainbow","Rainbow","checkbox"],["has_flip","Переворот","checkbox"],
      ["flip_description","Описание переворота","textarea"],
      ["mechanics","Механики"],["hero","Герой"],["source","Источник"],
      ["image_url","Картинка (url)"],["id","ID"],["card_number","№ карты"],
    ];
    const LIMIT = 8;
    let offset = 0;
    let reviewedCount = 0;
    let items = [];

    const $ = (id) => document.getElementById(id);

    function fieldInput(field, label, value, type, opts) {
      const v = value ?? "";
      let control;
      if (type === "textarea") {
        control = `<textarea data-f="${field}">${escapeHtml(v)}</textarea>`;
      } else if (type === "select") {
        control = `<select data-f="${field}">` + opts.map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("") + `</select>`;
      } else if (type === "checkbox") {
        control = `<input type="checkbox" data-f="${field}" ${v?"checked":""} />`;
      } else {
        control = `<input data-f="${field}" value="${escapeHtml(v)}" />`;
      }
      return `<div class="row"><label>${label}</label>${control}</div>`;
    }

    function escapeHtml(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

    function readFields(cardEl) {
      const out = {};
      cardEl.querySelectorAll("[data-f]").forEach(el => {
        const f = el.getAttribute("data-f");
        if (el.type === "checkbox") out[f] = el.checked;
        else out[f] = el.value;
      });
      return out;
    }

    function renderCard(it) {
      const saved = it.saved || {};
      const reviewed = !!saved.reviewed;
      const card = document.createElement("div");
      card.className = "card" + (reviewed ? " reviewed" : "");
      card.dataset.filename = it.filename;

      // Разделяем обычные поля и стат-поля (cost/attack/health)
      const mainFields = FIELDS.filter(([f]) => !STAT_FIELDS.has(f));
      const statFields = FIELDS.filter(([f]) => STAT_FIELDS.has(f));

      const fieldsHtml = mainFields.map(([f, l, t, o]) => fieldInput(f, l, saved[f], t, o)).join("");
      // Эмодзи для стат-блока: 💰 стоимость, ⚔️ атака, ❤️ здоровье
      const STAT_ICONS = { cost: "💰", attack: "⚔️", health: "❤️" };
      const STAT_LABELS = { cost: "Цена", attack: "Атака", health: "HP" };
      const statsHtml = `
        <div class="stats">
          ${statFields.map(([f]) => `
            <label class="stat" title="${STAT_LABELS[f]}">
              <span class="stat-icon">${STAT_ICONS[f]}</span>
              <input data-f="${f}" value="${escapeHtml(saved[f] ?? "")}" inputmode="numeric" />
            </label>
          `).join("")}
        </div>`;

      card.innerHTML = `
        <img src="${it.url}" alt="${it.filename}" />
        <div class="fname"><span>${it.filename}</span>${reviewed?'<span class="badge">размечено</span>':''}</div>
        ${statsHtml}
        <div class="actions">
          <button class="primary analyze">Анализировать</button>
          <button class="save">Сохранить</button>
          <span class="err"></span>
        </div>
        <div class="ocr" data-ocr>(сырой OCR-текст появится после анализа)</div>
        ${fieldsHtml}
      `;
      card.querySelector(".analyze").onclick = () => analyzeCard(card, it.filename);
      card.querySelector(".save").onclick = () => saveCard(card, it.filename);
      return card;
    }

    function fillFields(card, fields) {
      Object.entries(fields).forEach(([f, v]) => {
        const el = card.querySelector(`[data-f="${f}"]`);
        if (!el) return;
        // значения из сервера: null / "null" / "" / 0
        if (el.type === "checkbox") {
          el.checked = !!v && v !== "null" && v !== "";
        } else {
          // Для чисел — оставляем как есть (0 важно, "" — пусто)
          if (v === null || v === undefined || v === "null") {
            el.value = "";
          } else {
            el.value = v;
          }
          // Если value отсутствует в <option>, добавим его динамически
          if (el.tagName === "SELECT" && v && ![...el.options].some(o => o.value === v)) {
            const opt = new Option(v, v, true, true);
            el.add(opt);
          }
        }
      });
    }

    async function analyzeCard(card, filename) {
      const btn = card.querySelector(".analyze");
      const err = card.querySelector(".err");
      err.textContent = "";
      if (btn) { btn.disabled = true; btn.textContent = "…"; }
      try {
        const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ filename }) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "ошибка");
        card.querySelector("[data-ocr]").textContent = data.ocrText || "(нет текста)";
        fillFields(card, data.fields || {});
        return true;
      } catch (e) {
        err.textContent = e.message;
        return false;
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = "Анализировать"; }
      }
    }

    async function analyzeAllVisible() {
      const btnAll = $("analyzeAll");
      const cards = [...document.querySelectorAll(".card")];
      if (!cards.length) return;
      btnAll.disabled = true;
      const originalText = btnAll.textContent;
      let ok = 0, fail = 0;
      // Параллельность: запускаем по CONCURRENCY штук одновременно
      const CONCURRENCY = 6;

      // Помечаем каждую карту спиннером
      for (const c of cards) {
        const s = document.createElement("span");
        s.className = "status";
        s.textContent = "⏳";
        s.style.marginLeft = "6px";
        c.querySelector(".fname").appendChild(s);
      }

      const worker = async (c) => {
        const fname = c.dataset.filename;
        c.querySelector(".err").textContent = "";
        c.querySelector(".analyze").disabled = true;
        c.querySelector(".analyze").textContent = "…";
        try {
          const r = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: fname }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "ошибка");
          c.querySelector("[data-ocr]").textContent = data.ocrText || "(нет текста)";
          fillFields(c, data.fields || {});
          c.querySelector(".status").textContent = "✓";
          c.classList.add("reviewed");
          const badge = c.querySelector(".fname");
          if (!badge.querySelector(".badge")) badge.insertAdjacentHTML("beforeend", '<span class="badge">размечено</span>');
          ok++;
          return true;
        } catch (e) {
          c.querySelector(".status").textContent = "✗";
          c.querySelector(".err").textContent = e.message;
          fail++;
          return false;
        } finally {
          c.querySelector(".analyze").disabled = false;
          c.querySelector(".analyze").textContent = "Анализировать";
        }
      };

      // Простой пул воркеров: берём следующую карту из очереди,
      // как только один из воркеров завершился
      const queue = cards.slice();
      const updateProgress = () => {
        const done = ok + fail;
        btnAll.textContent = `⚡ ${done}/${cards.length} (✓${ok} ✗${fail})`;
      };
      const runners = Array.from({ length: Math.min(CONCURRENCY, cards.length) }, async () => {
        while (queue.length) {
          const c = queue.shift();
          if (!c) break;
          await worker(c);
          updateProgress();
        }
      });
      await Promise.all(runners);

      btnAll.textContent = `✓ готово: ${ok}/${cards.length}${fail ? `, ошибок: ${fail}` : ""}`;
      setTimeout(() => { btnAll.textContent = originalText; btnAll.disabled = false; }, 5000);
      // обновим счётчик «Размечено» в шапке
      reviewedCount = ok;
      $("reviewed").textContent = String(reviewedCount);
    }

    async function saveCard(card, filename) {
      const fields = readFields(card);
      const r = await fetch("/api/save", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ filename, fields }) });
      const data = await r.json();
      if (!r.ok) { card.querySelector(".err").textContent = data.error || "ошибка"; return; }
      card.classList.add("reviewed");
      const badge = card.querySelector(".fname");
      if (!badge.querySelector(".badge")) badge.insertAdjacentHTML("beforeend", '<span class="badge">размечено</span>');
      $("reviewed").textContent = String(++reviewedCount);
    }

    async function load() {
      const r = await fetch(`/api/cards?offset=${offset}&limit=${LIMIT}`);
      const data = await r.json();
      items = data.items;
      $("total").textContent = data.total;
      $("range").textContent = data.items.length ? `${data.offset+1}–${data.offset+data.items.length}` : "—";
      $("keys").textContent = data.keysConfigured;
      // reviewed count: count saved among all? we just count current page saved
      reviewedCount = data.items.filter(i => i.saved && i.saved.reviewed).length;
      $("reviewed").textContent = reviewedCount;
      const grid = $("grid");
      grid.innerHTML = "";
      data.items.forEach(it => grid.appendChild(renderCard(it)));
    }

    $("next").onclick = () => { offset += LIMIT; load(); window.scrollTo(0,0); };
    $("prev").onclick = () => { offset = Math.max(0, offset - LIMIT); load(); window.scrollTo(0,0); };
    $("analyzeAll").onclick = analyzeAllVisible;
    $("saveAll").onclick = async () => {
      for (const card of document.querySelectorAll(".card")) {
        await saveCard(card, card.dataset.filename);
      }
    };

    load();
  </script>
</body>
</html>

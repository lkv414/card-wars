name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck (TypeScript noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (node:test)
        run: npm test

      - name: Smoke tests (Vitest + RTL)
        run: npm run test:smoke

      - name: Store tests (Zustand + wsQueue)
        run: npx vitest run --config vitest.store.config.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Workers dry-run
        run: npm run workers:check

  supabase-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: DB lint
        run: npx supabase db lint

      - name: RPC contract checks
        run: npm run test:supabase

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Blue Card Gradient -->
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Green Card Gradient -->
    <linearGradient id="greenCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Sword Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" />

  <!-- LEFT CARD (Blue, Cornfield / Sandy land) -->
  <g transform="translate(256, 256) rotate(-14) translate(-256, -256)" filter="url(#shadow)">
    <!-- Card Outer Body -->
    <rect x="110" y="110" width="160" height="230" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Card Inner Face -->
    <rect x="122" y="122" width="136" height="206" rx="8" fill="url(#blueCardGrad)" />
    <!-- Card Art Window -->
    <rect x="132" y="136" width="116" height="110" rx="6" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Corn / Spiral Symbol -->
    <path d="M 190 191 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.8" />
    <polygon points="190,172 196,186 211,188 200,199 203,214 190,206 177,214 180,199 169,188 184,186" fill="#f59e0b" />
    <!-- Stat Badges -->
    <circle cx="140" cy="134" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="140" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="240" cy="134" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="240" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">5</text>
  </g>

  <!-- RIGHT CARD (Green, Plains) -->
  <g transform="translate(256, 256) rotate(14) translate(-256, -256)" filter="url(#shadow)">
    <!-- Card Outer Body -->
    <rect x="242" y="110" width="160" height="230" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Card Inner Face -->
    <rect x="254" y="122" width="136" height="206" rx="8" fill="url(#greenCardGrad)" />
    <!-- Card Art Window -->
    <rect x="264" y="136" width="116" height="110" rx="6" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Creature / Beast Silhouette -->
    <circle cx="322" cy="191" r="28" fill="#047857" stroke="#34d399" stroke-width="2" />
    <path d="M 306 200 C 310 180, 334 180, 338 200 Z" fill="#a7f3d0" />
    <circle cx="316" cy="186" r="4" fill="#ffffff" />
    <circle cx="328" cy="186" r="4" fill="#ffffff" />
    <!-- Stat Badges -->
    <circle cx="272" cy="134" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="272" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="372" cy="134" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="372" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">7</text>
  </g>

  <!-- CENTER CROSSED GOLDEN SWORDS -->
  <g filter="url(#glow)">
    <!-- SWORD 1 (\) -->
    <g transform="translate(256, 240) rotate(-45) translate(-256, -240)">
      <!-- Blade -->
      <polygon points="252,100 260,100 262,250 250,250" fill="url(#bladeGrad)" stroke="#475569" stroke-width="1" />
      <polygon points="256,90 260,100 252,100" fill="#f8fafc" />
      <!-- Guard -->
      <rect x="236" y="250" width="40" height="10" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
      <!-- Grip -->
      <rect x="252" y="260" width="8" height="24" rx="2" fill="#991b1b" stroke="#450a0a" stroke-width="1" />
      <!-- Pommel -->
      <circle cx="256" cy="289" r="7" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    </g>

    <!-- SWORD 2 (/) -->
    <g transform="translate(256, 240) rotate(45) translate(-256, -240)">
      <!-- Blade -->
      <polygon points="252,100 260,100 262,250 250,250" fill="url(#bladeGrad)" stroke="#475569" stroke-width="1" />
      <polygon points="256,90 260,100 252,100" fill="#f8fafc" />
      <!-- Guard -->
      <rect x="236" y="250" width="40" height="10" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
      <!-- Grip -->
      <rect x="252" y="260" width="8" height="24" rx="2" fill="#991b1b" stroke="#450a0a" stroke-width="1" />
      <!-- Pommel -->
      <circle cx="256" cy="289" r="7" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    </g>
  </g>

  <!-- CENTER CREST / BADGE (CARD WARS "CW") -->
  <g filter="url(#shadow)">
    <!-- Gold Ribbon / Badge -->
    <polygon points="176,340 336,340 356,380 336,420 176,420 156,380" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" />
    <rect x="184" y="348" width="144" height="64" rx="6" fill="#1e293b" />
    <text x="256" y="394" font-family="'Trebuchet MS', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="36" fill="url(#goldGrad)" letter-spacing="4" text-anchor="middle">
      CARD WARS
    </text>
  </g>
</svg>
